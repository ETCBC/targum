generic:
  name: ETCBC Targum Corpus
  source: ETCBC Targum Corpus
  institute: ETCBC (Eep Talstra Centre for Bible and Computer)
  sourceFormat: Data is first serialized into PostgreSQL, then XML, and finally Text Fabric. Base texts obtained from Comprehensive Aramaic Lexicon ("https://cal.huc.edu/")
  license: Attribution-NonCommercial 4.0 International
  licenseUrl: https://creativecommons.org/licenses/by-nc/4.0/deed.en
  converters: S.P. Swire
  compiler: S.P. Swire

intFeatures:
  - id
  - rank
  - reading
  - sibling
  - start_idx
  - end_idx
  - part
  - chapter
  - verse
  - freq_lex
  - rank_lex

featureDescriptions:
  # edge features
  parent:
    edge between a node and its parent node
  sibling: >-
    edge between a node and its preceding sibling nodes;
    labelled with the distance between them
  # node types
  text:
    Name of an Aramaic text, often a manuscript
  book:
    Name of Biblical book
  chapter:
    Chapter of the book
  view:
    Grouping of segments based on editorial and emendation filters present in the text
  verse:
    A line of text, typically (though not always) corresponding to a verse in a book or manuscript
  segment:
    Grouping of words and word groups based on position within discrete editorial or emendation blocks (e.g., variants)
  word_group:
    Word groups (space-delimited units of characters, including immediately ensuing variants; contains at least one word)
  word:
    Words (slots)—the smallest semantic elements, carrying number, gender, part of speech and the rest of the morphology

  # general and structural
  id:
    xml id, associated to primary key in other data stores (SQL)
  rank: >-
    ordinal position of the node among its siblings, counting from the start of the enclosing node, within the line
  reading: >-
    which reading of a word group this is; readings competing for one position of the
    line share a rank and differ here, 0 being the one the edition prints. Value 0 is the "original" reading the first scribe wrote in the manuscript, and 1, 2, 3 are the scribal or editorial emendation candidates. Every rank that has any reading has a reading 0. Almost all of them come from one editorial marker, and are defined by segment types such as 'variant,'interlinear,'addition' etc. This distribution is a property of the view type.
  source: >-
    provenance of a word; "word" where morphology was placed on it, "word_group" where the word group carries a surface form that no morphology points at, and "none" where the manuscript has a word that was never analysed
  uid:
    independent unique identifier of the node
  source_id:
    ID of the segment source
  parent_id:
    ID of the segment parent
  book_id:
    ID of the book
  description:
    Description of a text, view, word, lemma, etc.
  type:
    type of the node (e.g., unmarked_text for segment, full_text for view). A segment of type marginal holds a reading written in the margin of the manuscript. A reading transcribed on a line of its own, whether marginal or a variant of the whole verse from another witness, follows the words of the verse it annotates
  start_idx: >-
    one-based character offset of the first character of a word or of a segment within `line`,
    the ETCBC transliteration of the verse that contains it; a segment's offsets are the
    minimum and the maximum of the offsets of the words it holds, and both tiers leave them
    absent where the word carries no surface form or where the word tier and `line` diverge.
    A reading transcribed on a line of its own, marginal or a whole-verse variant, is not part
    of `line`. Its words carry no offsets, and the offsets of its segment locate instead the
    words of `line` that the reading annotates, absent where those words could not be
    identified
  end_idx: >-
    one-based character offset of the last character of a word or of a segment within `line`,
    so that `substr(line, start_idx, end_idx - start_idx + 1)` returns the word's own `voc`
    or the segment's own `segment`
  line:
    Vocalized text of a verse in ETCBC transcription. The words of a reading transcribed on a line of its own, marginal or a whole-verse variant, are not part of it
  line_utf8:
    Vocalized text of a verse in Aramaic square script
  segment_utf8:
    Vocalized text of a segment in Aramaic square script

  # word and word group (word-level and morpheme features)
  g_cons:
    Consonantal text of a word group in ETCBC transcription
  g_cons_utf8:
    Consonantal text of a word group in Aramaic square script
  g_voc:
    Vocalized text of a word group in ETCBC transcription
  g_voc_utf8:
    Vocalized text of a word group in Aramaic square script
  cons:
    Consonantal text of a word in ETCBC transcription
  cons_utf8:
    Consonantal text of a word in Aramaic square script
  voc:
    Vocalized text of a word in ETCBC transcription
  voc_utf8:
    Vocalized text of a word in Aramaic square script
  lex:
    Lexeme in ETCBC transcription
  gloss:
    English gloss
  definition:
    Extended translation or dictionary definition
  sp:
    Part of speech
  vs:
    Verbal stem / binyan
  gn:
    Gender (nominal only, partial)
  nu:
    Number (nominal only, partial)
  st:
    Nominal state (abs/emph/cons, partial)
  trailer:
    Content after a word (empty space or None)
  root:
    Root, typically of a verb
  g_lex:
    Realization of the lexeme in ETCBC transcription
  g_lex_utf8:
    Realization of the lexeme in Aramaic
  vt:
    Verbal tense
  vo:
    Voice
  ps:
    Person
  crossref: >-
    Parallel witnesses. An edge between two `verse` nodes that carry the same canonical
    `(book, chapter, verse)` address. A label of
    `witness` means that two manuscripts translate this verse, which is a parallel. A label of
    `view` means one manuscript presented under two editorial filters: the two
    views of Neofiti are the same codex. A label of `same_witness` means one manuscript under
    one filter holding more than one verse record at this address
  manuscript: >-
    The manuscript that a text witnesses, carried by `text` nodes.
  lexeme: >-
    One node per lexeme of the corpus, carrying the lexical data that would otherwise be
    repeated on every token of it. This is the only node type in the dataset that is not
    contained within the text tree. A lexeme is not located inside a verse, its slots are
    distributed across the whole corpus, and the five witnesses share them, so a lexeme attested
    in both Neofiti and Pseudo-Jonathan is a single node with slots in each.
  part: >-
    Which part of a word this node is, counting from 1, where an editorial boundary divides one
    printed word in two. A word with `part` 1 and no sibling is whole
  lex0: >-
    `lex` with the disambiguation material removed, so that two homographs of one part of speech
    share a value. The companion to `lex` that the BHSA also publishes, and the value to group
    by when counting vocabulary
  lex_utf8:
    Lexeme in Aramaic square script
  freq_lex: >-
    How many words of the corpus carry this lexeme, on `lexeme` nodes.
  rank_lex: >-
    Position of the lexeme in the frequency list of the corpus, 1 being the most frequent, on
    `lexeme` nodes.