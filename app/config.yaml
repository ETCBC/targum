apiVersion: 3
dataDisplay:
  excludedFeatures: []
  noneValues:
  - none
  - unknown
  - null
  - NA
  sectionSep1: '@'
  textFormat: text-orig-full
docs:
  docPage: about
  featureBase: '{docBase}/transcription.md#<feature>'
  featurePage: transcription
interfaceDefaults:
  fmt: text-orig-full
provenanceSpec:
  backend: github
  branch: main
  corpus: '{org} - {repo}{relative}'
  doi: 10.5281/zenodo.21925395
  moduleSpecs: []
  org: ETCBC
  repo: targum
  version: '0.1'
  webBase: https://github.com/ETCBC/targum
  webHint: Show this on the website
  webLang: en
  webUrl: '{webBase}/tree/{branch}#<1>-<2>-<3>'
typeDisplay:
  lexeme:
    features: lex lex0 lex_utf8 freq_lex rank_lex
    lexOcc: word
    template: '{lex}'
  segment:
    features: type start_idx end_idx
    template: '{type}'
  word_group:
    features: reading rank
    template: '{g_voc}'
writing: hbo
